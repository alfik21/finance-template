<script>
  const appState = {
    activeTab: 'dashboard',
    selectedCycle: 'month',
    // S-12: periode dashboard (bulan berjalan) dan periode Buku Kas dipisah.
    currentMonthPeriod: localMonthPeriod(),
    bookMonthPeriod: localMonthPeriod(),
    bookView: 'daily', // 'daily' | 'monthly' | 'stats'
    statsType: 'Expense', // 'Expense' | 'Income'
    data: null,
    isLoading: true,
    filterCategory: 'ALL',
    searchQuery: '',
    // S-09: pelacak modal terbuka agar Escape menutup satu modal teratas saja.
    modalStack: [],
    lastFocusedElement: null,
    form: {
      type: 'Expense',
      walletId: '',
      categoryId: ''
    }
  };

  /* ==========================================================================
   * Utilitas dasar (S-01, S-05, S-10, S-14)
   * ========================================================================*/

  /**
   * Toast notifikasi non-blocking (mengganti showToast() yang menghentikan UI).
   * type: 'error' (default) | 'success' | 'info'. Otomatis menghilang 3.5s.
   */
  function showToast(message, type) {
    const stack = document.getElementById('toast-stack');
    if (!stack) { alert(message); return; }
    const kind = type || 'error';
    const el = document.createElement('div');
    el.className = 'toast toast-' + kind;
    el.setAttribute('role', kind === 'error' ? 'alert' : 'status');
    el.textContent = message;
    stack.appendChild(el);
    // Paksa reflow agar animasi masuk berjalan.
    void el.offsetWidth;
    el.classList.add('toast-show');
    setTimeout(() => {
      el.classList.remove('toast-show');
      el.addEventListener('transitionend', () => el.remove(), { once: true });
      // Jaring pengaman bila transitionend tidak terpicu.
      setTimeout(() => el.remove(), 400);
    }, 3500);
  }

  /** S-01: escape data dinamis sebelum masuk innerHTML/atribut. */
  function esc(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /** S-05: tanggal lokal (bukan UTC) agar cocok dengan backend Asia/Jakarta. */
  function localDateStr(d) {
    const dt = d || new Date();
    const y = dt.getFullYear();
    const m = String(dt.getMonth() + 1).padStart(2, '0');
    const day = String(dt.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function localMonthPeriod(d) {
    const dt = d || new Date();
    const y = dt.getFullYear();
    const m = String(dt.getMonth() + 1).padStart(2, '0');
    return `${y}-${m}`;
  }

  function initApp() {
    setupDemoModeBanner();
    loadDashboardData();
    setupKeyboardShortcuts();
    setupOfflineWatcher();
  }

  // Banner demo hanya tampil pada artefak statis/mock, bukan deployment GAS.
  function setupDemoModeBanner() {
    const hasMockBackend = typeof window.__MOCK_DB__ !== 'undefined';
    const hasAppsScriptBackend = typeof google !== 'undefined' && google.script && google.script.run;
    const banner = document.getElementById('demo-mode-banner');
    if (banner) banner.style.display = (hasMockBackend || !hasAppsScriptBackend) ? 'block' : 'none';
  }

  /* ==========================================================================
   * R-02: layar penolakan akses (email tidak terdaftar di whitelist)
   * ========================================================================*/

  /** Tampilkan layar penuh "Akses Ditolak" (tanpa data aplikasi apa pun). */
  function showAccessDeniedScreen(message) {
    if (document.getElementById('access-denied-screen')) return;
    const overlay = document.createElement('div');
    overlay.id = 'access-denied-screen';
    overlay.setAttribute('role', 'alert');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:var(--bg-canvas,#f6f8f7);' +
      'display:flex;align-items:center;justify-content:center;padding:24px;';
    overlay.innerHTML =
      '<div style="max-width:520px;background:var(--bg-surface,#fff);border:1px solid var(--border-color,#e1e5ea);' +
      'border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(28,30,33,.08);font-family:var(--font-sans, sans-serif);">' +
      '<span style="display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;' +
      'color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:999px;padding:4px 10px;margin-bottom:14px;">Akses Ditolak</span>' +
      '<h1 style="font-size:20px;margin:0 0 10px;color:var(--text-main,#1c1e21);">Anda tidak memiliki akses ke Finance Tracker</h1>' +
      '<div style="background:var(--bg-subtle,#f4f7f5);border:1px solid var(--border-color,#e1e5ea);border-radius:10px;' +
      'padding:12px 14px;font-size:13px;color:var(--text-main,#1c1e21);margin-bottom:14px;word-break:break-word;">' +
      '<b>Email terdeteksi:</b><br>' + esc(typeof userEmail !== 'undefined' ? userEmail : '') + '</div>' +
      '<p style="font-size:14px;line-height:1.6;color:var(--text-muted,#656b73);margin:0 0 12px;">' + esc(message || '') + '</p>' +
      '<p style="font-size:14px;line-height:1.6;color:var(--text-muted,#656b73);margin:0 0 12px;"><b>Solusi:</b> ' +
      'Daftarkan email Anda pada sheet <b>PENGATURAN</b> (baris <b>Email Pemilik</b> / <b>Email Tambahan</b>, dipisah koma) ' +
      'atau pada <b>Project Settings &gt; Script Properties &gt; ALLOWED_EMAILS</b>. Perubahan langsung berlaku tanpa deploy ulang.</p>' +
      '<p style="font-size:12px;color:var(--text-subtle,#94a3b8);margin:0;">Link Web App ini hanya dibuka oleh akun Google ' +
      'yang terdaftar sebagai pemilik atau pengguna izin spreadsheet.</p>' +
      '</div>';
    document.body.appendChild(overlay);
  }

  /** true bila respons server adalah penolakan akses (lalu tampilkan layar). */
  function handleAccessDenied_(res) {
    if (res && res.accessDenied) {
      appState.isLoading = false;
      showAccessDeniedScreen(res.error);
      return true;
    }
    return false;
  }

  function loadDashboardData() {
    // S-06: hanya menampilkan layar "Memuat" saat data pertama kali kosong.
    if (!appState.data) appState.isLoading = true;
    renderApp();

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(res => {
          appState.isLoading = false;
          if (res && res.success) {
            appState.data = res.data;
            if (appState.data && appState.data.monthSummary && appState.data.monthSummary.period) {
              appState.currentMonthPeriod = appState.data.monthSummary.period;
              if (!appState.bookMonthPeriod) appState.bookMonthPeriod = appState.currentMonthPeriod;
            }
            if (appState.data && Array.isArray(appState.data.wallets) && appState.data.wallets.length > 0 && !appState.form.walletId) {
              appState.form.walletId = appState.data.wallets[0].id;
            }
            if (appState.data && Array.isArray(appState.data.categories) && appState.data.categories.length > 0 && !appState.form.categoryId) {
              const expCat = appState.data.categories.find(c => c.type === 'Expense');
              if (expCat) appState.form.categoryId = expCat.id;
            }
            // QC v1.8.0 (temuan verifikasi browser): pengguna bisa membuka modal
            // transaksi selagi data masih dimuat. Saat itu dropdown kategori masih
            // kosong dan renderApp tidak pernah mengisinya kembali, sehingga user
            // terkunci pada alert "Pilih kategori". Isi ulang bila modal terbuka.
            refreshOpenTransactionModal_();
          } else {
            if (handleAccessDenied_(res)) return;
            showToast("Kendala memuat data: " + ((res && res.error) || "Gagal memuat data") +
              ". Periksa koneksi internet lalu muat ulang.");
          }
          renderApp();
        })
        .withFailureHandler(err => {
          appState.isLoading = false;
          const msg = (err && err.message) ? err.message : 'Tidak terhubung ke server Apps Script.';
          showToast("Gagal terhubung: " + msg +
            (navigator.onLine === false ? " (Perangkat sedang offline)" : "") +
            ". Klik tombol Muat Ulang bila berulang.");
          renderApp();
        })
        .apiDispatcher('getDashboard', {});
    } else {
      // S-02: bila API tidak tersedia, jangan layar "Memuat" selamanya.
      appState.isLoading = false;
      renderApp();
    }
  }

  /** S-15: deteksi offline/online agar pengguna tahu penyebab gagal simpan. */
  function setupOfflineWatcher() {
    const rerender = () => {
      const banner = document.getElementById('offline-banner');
      if (banner) banner.style.display = navigator.onLine === false ? 'block' : 'none';
    };
    window.addEventListener('online', rerender);
    window.addEventListener('offline', rerender);
    document.addEventListener('DOMContentLoaded', rerender);
    rerender();
  }

  function retryLoad() {
    loadDashboardData();
  }

  function setupKeyboardShortcuts() {
    window.addEventListener('keydown', (e) => {
      const modalOpen = appState.modalStack.length > 0;
      if (e.key === 'Escape') {
        // S-09: Escape hanya menutup modal teratas, bukan seluruh modal sekaligus.
        if (modalOpen) {
          e.preventDefault();
          closeModal(appState.modalStack[appState.modalStack.length - 1]);
        }
      } else if ((e.key === 'n' || e.key === 'N') && !modalOpen &&
          !['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        e.preventDefault();
        openModal('transaction-modal', 'Expense');
      }
    });

    // S-01: aksi baris (edit/hapus) memakai data-attribute + delegation,
    // bukan string id yang disisipkan mentah ke onclick.
    document.addEventListener('click', (e) => {
      const target = e.target.closest ? e.target.closest('[data-action]') : null;
      if (!target) return;
      const action = target.getAttribute('data-action');
      const id = target.getAttribute('data-id') || '';
      switch (action) {
        case 'edit-tx': e.preventDefault(); editTx(id); break;
        case 'delete-tx': e.preventDefault(); deleteTx(id); break;
        case 'delete-wallet': e.preventDefault(); deleteWallet(id); break;
        case 'restore-wallet': e.preventDefault(); restoreWallet(id); break;
        case 'delete-budget': e.preventDefault(); deleteBudget(id); break;
        case 'select-month': e.preventDefault(); selectMonthlyPeriod(id); break;
        default: break;
      }
    });
  }

  function switchTab(tab) {
    appState.activeTab = tab;
    document.querySelectorAll('.nav-item').forEach(el => {
      if (el.getAttribute('data-tab') === tab) {
        el.classList.add('active');
      } else {
        el.classList.remove('active');
      }
    });
    document.querySelectorAll('.mobile-nav-item').forEach(el => {
      if (el.getAttribute('data-tab') === tab) {
        el.classList.add('active');
      } else {
        el.classList.remove('active');
      }
    });
    renderApp();
  }

  function switchBookView(view) {
    appState.bookView = view;
    renderApp();
  }

  function switchStatsType(type) {
    appState.statsType = type;
    renderApp();
  }

  /** S-14: parsing nominal menghormati pemisah ribuan; "1.5" tidak lagi jadi 15. */
  function parseCurrencyValue(val) {
    if (typeof val === 'number') return isFinite(val) ? val : 0;
    if (!val) return 0;
    let s = String(val).trim().replace(/[^\d.,]/g, '');
    if (!s) return 0;
    if (/^\d{1,3}([.,]\d{3})+$/.test(s)) {
      s = s.replace(/[.,]/g, ''); // pola ribuan: 1.500.000 -> 1500000
    } else {
      s = s.replace(/\.(?=\d{3}(\D|$))/g, '').replace(/,/g, '.');
      if (!/^\d+(\.\d+)?$/.test(s)) s = s.replace(/[^\d]/g, '');
    }
    const n = Number(s);
    if (!isFinite(n)) return 0;
    // Batas atas wajar (15 digit) agar tidak ada nilai ekstrem masuk sheet.
    return Math.min(n, 999999999999999);
  }

  function handleCurrencyInput(el) {
    if (!el) return;
    const originalValue = el.value;
    const origCursorPos = el.selectionStart || 0;

    // Hitung jumlah digit sebelum posisi kursor awal untuk menjaga letak kursor
    const digitsBeforeCursor = originalValue.slice(0, origCursorPos).replace(/\D/g, '').length;

    const rawVal = parseCurrencyValue(originalValue);
    if (rawVal === 0 && originalValue.trim() === '') {
      el.value = '';
      return;
    }

    const formatted = new Intl.NumberFormat('id-ID').format(rawVal);
    el.value = formatted;

    // Hitung ulang posisi kursor berdasarkan digit yang ada
    let newCursorPos = 0;
    let digitsCount = 0;
    while (newCursorPos < formatted.length && digitsCount < digitsBeforeCursor) {
      if (/\d/.test(formatted[newCursorPos])) {
        digitsCount++;
      }
      newCursorPos++;
    }

    try {
      el.setSelectionRange(newCursorPos, newCursorPos);
    } catch (e) {}
  }

  /** Chips nominal cepat: tambah nominal berjalan tanpa mengetik. */
  function bumpTransactionAmount(delta) {
    const amountEl = document.getElementById('form-amount');
    if (!amountEl) return;
    const current = parseCurrencyValue(amountEl.value) || 0;
    amountEl.value = new Intl.NumberFormat('id-ID').format(Math.max(0, current + delta));
  }

  function applyQuickTemplate(name, amount, type, categoryName) {
    handleFormTypeChange(type);
    const amountEl = document.getElementById('form-amount');
    const notesEl = document.getElementById('form-notes');
    if (amountEl) {
      amountEl.value = new Intl.NumberFormat('id-ID').format(amount);
    }
    if (notesEl) notesEl.value = name;

    if (appState.data && appState.data.categories) {
      const catLower = (categoryName || '').toLowerCase();
      const cat = appState.data.categories.find(c => 
        c.type === type && (c.name.toLowerCase() === catLower || c.name.toLowerCase().includes(catLower) || catLower.includes(c.name.toLowerCase()))
      );
      if (cat) {
        const catSelect = document.getElementById('form-category');
        if (catSelect) catSelect.value = cat.id;
        appState.form.categoryId = cat.id;
      }
    }
  }

  /** S-10: format rupiah menangani angka negatif secara konsisten (-Rp 50.000). */
  function formatRupiah(num) {
    const n = Number(num) || 0;
    const abs = Math.abs(n);
    const text = "Rp " + new Intl.NumberFormat('id-ID').format(abs);
    return n < 0 ? "-" + text : text;
  }

  function formatPeriodMonth(periodStr) {
    if (!periodStr) return '';
    const parts = periodStr.split('-');
    const m = parts[1];
    const y = parts[0];
    const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const idx = parseInt(m, 10) - 1;
    return (months[idx] || m) + ' ' + y;
  }

  function formatPeriodDate(dateStr) {
    if (!dateStr) return '';
    const parts = dateStr.split('-');
    if (parts.length < 3) return dateStr;
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const idx = parseInt(parts[1], 10) - 1;
    return `${parseInt(parts[2], 10)} ${months[idx] || parts[1]} ${parts[0]}`;
  }

  function formatFullDateWithDay(dateStr) {
    if (!dateStr || dateStr.length < 10) return dateStr || '-';
    const parts = dateStr.split('-');
    const y = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10);
    const d = parseInt(parts[2], 10);
    const dateObj = new Date(y, m - 1, d);
    const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const dayName = days[dateObj.getDay()] || '';
    const monthName = months[m - 1] || m;
    return `${dayName}, ${d} ${monthName} ${y}`;
  }

  function changeMonthStep(delta) {
    // S-12: stepper Buku Kas hanya mengubah periode Buku Kas,
    // tidak lagi mengubah angka "Bulan Ini" di Dashboard.
    const base = appState.bookMonthPeriod || appState.currentMonthPeriod;
    const parts = base.split('-');
    let y = parseInt(parts[0], 10);
    let m = parseInt(parts[1], 10) + delta;
    if (m > 12) { m = 1; y += 1; }
    else if (m < 1) { m = 12; y -= 1; }
    appState.bookMonthPeriod = `${y}-${String(m).padStart(2, '0')}`;
    renderApp();
  }

  function groupTransactionsByDate(transactions) {
    const groups = {};
    transactions.forEach(tx => {
      const dateKey = tx.date || 'Lainnya';
      if (!groups[dateKey]) {
        groups[dateKey] = { date: dateKey, items: [], totalNet: 0, totalIncome: 0, totalExpense: 0 };
      }
      groups[dateKey].items.push(tx);
      const amt = Number(tx.amount) || 0;
      if (tx.type === 'Income') {
        groups[dateKey].totalIncome += amt;
        groups[dateKey].totalNet += amt;
      } else if (tx.type === 'Expense') {
        groups[dateKey].totalExpense += amt;
        groups[dateKey].totalNet -= amt;
      }
    });
    return Object.keys(groups).sort((a, b) => b.localeCompare(a)).map(k => groups[k]);
  }

  function getCategoryBreakdown(transactions, targetType = 'Expense') {
    const matchedTxs = (transactions || []).filter(t => t.type === targetType);
    const totalAmt = matchedTxs.reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
    if (totalAmt === 0) return { items: [], total: 0 };
    const map = {};
    matchedTxs.forEach(t => {
      const cat = t.categoryName || 'Lainnya';
      map[cat] = (map[cat] || 0) + (Number(t.amount) || 0);
    });
    const items = Object.keys(map).map(cat => {
      const amt = map[cat];
      const percent = Math.round((amt / totalAmt) * 100);
      return { name: cat, categoryName: cat, amount: amt, percent };
    }).sort((a, b) => b.amount - a.amount);
    return { items, total: totalAmt };
  }

  function getWalletBreakdown(transactions, wallets, targetType) {
    // S-13: sebaran dompet mengikuti mode statistik (Pengeluaran/Pemasukan).
    const type = targetType || 'Expense';
    const matchedTxs = (transactions || []).filter(t => t.type === type);
    const totalExp = matchedTxs.reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
    if (totalExp === 0) return [];
    const map = {};
    matchedTxs.forEach(t => {
      const wId = t.walletId;
      const w = (wallets || []).find(x => x.id === wId);
      const wName = w ? w.name : 'Lainnya';
      map[wName] = (map[wName] || 0) + (Number(t.amount) || 0);
    });
    return Object.keys(map).map(name => {
      const amt = map[name];
      const percent = Math.round((amt / totalExp) * 100);
      return { walletName: name, amount: amt, percent };
    }).sort((a, b) => b.amount - a.amount);
  }

  const CHART_PALETTE = ['#1b4332', '#2d6a4f', '#40916c', '#d97706', '#dc2626', '#2563eb', '#656b73', '#0891b2', '#059669', '#7c3aed'];

  function renderDonutChart(items, total) {
    if (!items || items.length === 0 || total === 0) {
      return `
        <div class="donut-wrapper">
          <svg class="donut-chart-svg" viewBox="0 0 42 42">
            <circle cx="21" cy="21" r="15.91549430918954" fill="transparent" stroke="var(--bg-subtle)" stroke-width="5"></circle>
            <text x="21" y="22" font-size="3" font-weight="700" text-anchor="middle" fill="var(--text-muted)" transform="rotate(90 21 21)">Rp 0</text>
          </svg>
          <div style="font-size: 13px; color: var(--text-muted);">Belum ada data untuk ditampilkan.</div>
        </div>
      `;
    }

    // S-11: akumulasi dihitung dari rasio asli (bukan persen yang sudah
    // dibulatkan) agar total selalu 100% tanpa celah/tumpang tindih.
    const totalRaw = items.reduce((sum, item) => sum + (Number(item.amount) || 0), 0) || total;
    let cumulativeFraction = 0;
    const slices = items.map((item, idx) => {
      const color = CHART_PALETTE[idx % CHART_PALETTE.length];
      const fraction = totalRaw > 0 ? ((Number(item.amount) || 0) / totalRaw) * 100 : 0;
      const strokeDash = `${fraction} ${100 - fraction}`;
      const strokeOffset = 100 - cumulativeFraction;
      cumulativeFraction += fraction;
      return `<circle cx="21" cy="21" r="15.91549430918954" fill="transparent" stroke="${color}" stroke-width="5" stroke-dasharray="${strokeDash}" stroke-dashoffset="${strokeOffset}" transform="rotate(-90 21 21)"></circle>`;
    }).join('');

    const legend = items.map((item, idx) => {
      const color = CHART_PALETTE[idx % CHART_PALETTE.length];
      return `
        <div class="donut-legend-item">
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="donut-color-dot" style="background:${color};"></span>
            <span style="font-weight:600;">${item.name}</span>
          </div>
          <div class="tabular font-medium">
            <span>${formatRupiah(item.amount)}</span>
            <span style="color:var(--text-muted); margin-left:4px;">(${item.percent}%)</span>
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="donut-wrapper">
        <svg class="donut-chart-svg" viewBox="0 0 42 42">
          <circle cx="21" cy="21" r="15.91549430918954" fill="transparent" stroke="var(--bg-subtle)" stroke-width="5"></circle>
          ${slices}
          <text x="21" y="21" font-size="3.2" font-weight="700" text-anchor="middle" fill="var(--text-main)" transform="rotate(90 21 21)">${formatRupiah(total)}</text>
          <text x="21" y="24.5" font-size="1.8" font-weight="600" text-anchor="middle" fill="var(--text-muted)" transform="rotate(90 21 21)">Total</text>
        </svg>
        <div class="donut-legend">${legend}</div>
      </div>
    `;
  }

  function selectMonthlyPeriod(period) {
    // S-12: pemilih bulan pada tampilan Bulanan juga menyangkut Buku Kas saja.
    appState.bookMonthPeriod = period;
    renderApp();
  }

  function getMonthlySummaryGroups(transactions) {
    const groups = {};
    (transactions || []).forEach(tx => {
      if (!tx.date) return;
      const period = tx.date.substring(0, 7);
      if (!groups[period]) {
        groups[period] = {
          period: period,
          income: 0,
          expense: 0,
          net: 0,
          count: 0,
          items: []
        };
      }
      const amt = Number(tx.amount) || 0;
      if (tx.type === 'Income') {
        groups[period].income += amt;
        groups[period].net += amt;
      } else if (tx.type === 'Expense') {
        groups[period].expense += amt;
        groups[period].net -= amt;
      }
      groups[period].count += 1;
      groups[period].items.push(tx);
    });

    const sortedPeriods = Object.keys(groups).sort((a, b) => b.localeCompare(a));
    const fallbackPeriod = appState.bookMonthPeriod || appState.currentMonthPeriod;
    if (sortedPeriods.length === 0 && fallbackPeriod) {
      groups[fallbackPeriod] = {
        period: fallbackPeriod,
        income: 0,
        expense: 0,
        net: 0,
        count: 0,
        items: []
      };
      sortedPeriods.push(fallbackPeriod);
    }
    return sortedPeriods.map(p => groups[p]);
  }

                <div class="monthly-stat-item" style="text-align: right;">

  function switchCycle(cycle) {
    appState.selectedCycle = cycle;
    renderApp();
  }

  function openModal(modalId, defaultType) {
    if (modalId === 'transaction-modal') {
      const editInput = document.getElementById('form-edit-id');
      if (editInput) editInput.value = '';
      const titleEl = document.getElementById('transaction-modal-title');
      if (titleEl) titleEl.innerText = 'Catat Transaksi Kas';
      const submitBtn = document.getElementById('btn-submit-tx');
      if (submitBtn) submitBtn.innerText = 'Simpan Transaksi';
      
      const amtEl = document.getElementById('form-amount');
      const notesEl = document.getElementById('form-notes');
      if (amtEl) amtEl.value = '';
      if (notesEl) notesEl.value = '';
      const dateEl = document.getElementById('form-date');
      // S-05: tanggal default memakai tanggal lokal, bukan UTC.
      if (dateEl) dateEl.value = localDateStr();

      if (defaultType) {
        handleFormTypeChange(defaultType);
      }
    } else if (modalId === 'wallet-modal') {
      const nameEl = document.getElementById('wallet-name');
      const balEl = document.getElementById('wallet-initial-balance');
      if (nameEl) nameEl.value = '';
      if (balEl) balEl.value = '';
    } else if (modalId === 'budget-modal') {
      const catSelect = document.getElementById('budget-cat');
      if (catSelect && appState.data && appState.data.categories) {
        const expenseCats = appState.data.categories.filter(c => c.type === 'Expense');
        catSelect.innerHTML = expenseCats.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
      }
      const limitInput = document.getElementById('budget-limit');
      if (limitInput) limitInput.value = '';
    }
    const modal = document.getElementById(modalId);
    if (modal) {
      // S-09/S-16: catat modal terbuka, fokuskan input pertama, kembalikan fokus saat tutup.
      if (appState.modalStack.indexOf(modalId) === -1) appState.modalStack.push(modalId);
      if (!appState.lastFocusedElement) appState.lastFocusedElement = document.activeElement;
      modal.style.display = 'flex';
      modal.setAttribute('aria-hidden', 'false');
      const focusTarget = modal.querySelector('input:not([type="hidden"]), select, button');
      if (focusTarget) {
        try { focusTarget.focus({ preventScroll: true }); } catch (e) { focusTarget.focus(); }
      }
    }
  }

  function editTx(txId) {
    if (!appState.data || !appState.data.recentTransactions) return;
    const tx = appState.data.recentTransactions.find(t => t.id === txId);
    if (!tx) return;

    openModal('transaction-modal', tx.type);

    const editInput = document.getElementById('form-edit-id');
    if (editInput) editInput.value = tx.id;
    const titleEl = document.getElementById('transaction-modal-title');
    if (titleEl) titleEl.innerText = 'Edit Transaksi Kas';
    const submitBtn = document.getElementById('btn-submit-tx');
    if (submitBtn) submitBtn.innerText = 'Simpan Perubahan';

    const amtEl = document.getElementById('form-amount');
    if (amtEl) amtEl.value = new Intl.NumberFormat('id-ID').format(tx.amount || 0);

    const dateEl = document.getElementById('form-date');
    if (dateEl) dateEl.value = tx.date || localDateStr();

    const notesEl = document.getElementById('form-notes');
    if (notesEl) notesEl.value = tx.notes || '';

    // S-08: transaksi pada dompet nonaktif tetap bisa diedit - opsi dompet
    // nonaktif ditambahkan sementara agar nilai select tidak menjadi kosong.
    const walletEl = document.getElementById('form-wallet');
    if (walletEl && tx.walletId) {
      ensureWalletOption(walletEl, tx.walletId, tx.walletName);
      walletEl.value = tx.walletId;
    }

    if (tx.type === 'Transfer') {
      const destWalletEl = document.getElementById('form-dest-wallet');
      if (destWalletEl && tx.destWalletId) {
        ensureWalletOption(destWalletEl, tx.destWalletId, tx.destWalletName);
        destWalletEl.value = tx.destWalletId;
      }
    } else {
      const catEl = document.getElementById('form-category');
      if (catEl && tx.categoryId) {
        ensureOption(catEl, tx.categoryId, tx.categoryName);
        catEl.value = tx.categoryId;
      }
    }
  }

  /** S-08: tambahkan opsi bila id tidak ada di daftar (dompet/kategori nonaktif). */
  function ensureWalletOption(selectEl, id, label) {
    const exists = Array.from(selectEl.options).some(o => o.value === id);
    if (!exists) {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = (label || id) + ' (Nonaktif)';
      selectEl.appendChild(opt);
    }
  }

  function ensureOption(selectEl, id, label) {
    const exists = Array.from(selectEl.options).some(o => o.value === id);
    if (!exists) {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = label || id;
      selectEl.appendChild(opt);
    }
  }

  function closeModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) {
      modal.style.display = 'none';
      modal.setAttribute('aria-hidden', 'true');
    }
    const idx = appState.modalStack.indexOf(modalId);
    if (idx !== -1) appState.modalStack.splice(idx, 1);
    // S-16: kembalikan fokus ke elemen pemicu bila masih ada di dokumen.
    const prev = appState.lastFocusedElement;
    appState.lastFocusedElement = null;
    if (prev && document.contains(prev)) {
      try { prev.focus({ preventScroll: true }); } catch (e) { /* abaikan */ }
    }
  }

  function closeAllModals() {
    // S-09: tutup dari modal teratas agar tidak ada input hilang sekaligus.
    while (appState.modalStack.length > 0) {
      closeModal(appState.modalStack[appState.modalStack.length - 1]);
    }
    document.querySelectorAll('.modal-overlay').forEach(el => {
      el.style.display = 'none';
      el.setAttribute('aria-hidden', 'true');
    });
  }

  function handleFormTypeChange(newType) {
    appState.form.type = newType;
    const btnExp = document.getElementById('btn-type-expense');
    const btnInc = document.getElementById('btn-type-income');
    const btnTrf = document.getElementById('btn-type-transfer');

    if (btnExp) {
      btnExp.style.fontWeight = newType === 'Expense' ? '700' : '500';
      btnExp.classList.toggle('active', newType === 'Expense');
    }
    if (btnInc) {
      btnInc.style.fontWeight = newType === 'Income' ? '700' : '500';
      btnInc.classList.toggle('active', newType === 'Income');
    }
    if (btnTrf) {
      btnTrf.style.fontWeight = newType === 'Transfer' ? '700' : '500';
      btnTrf.classList.toggle('active', newType === 'Transfer');
    }

    const walletLabel = document.getElementById('form-wallet-label');
    const catLabel = document.getElementById('form-category-label');
    const quickChips = document.getElementById('modal-quick-chips');

    if (newType === 'Expense') {
      if (walletLabel) walletLabel.innerText = "Diambil dari Kantong";
      if (catLabel) catLabel.innerText = "Kategori Pengeluaran";
      document.getElementById('form-category-group').style.display = 'block';
      document.getElementById('form-dest-wallet-group').style.display = 'none';
      if (quickChips) quickChips.style.display = 'block';
      updateCategoryDropdown('Expense');
    } else if (newType === 'Income') {
      if (walletLabel) walletLabel.innerText = "Masuk ke Kantong";
      if (catLabel) catLabel.innerText = "Kategori Pemasukan";
      document.getElementById('form-category-group').style.display = 'block';
      document.getElementById('form-dest-wallet-group').style.display = 'none';
      if (quickChips) quickChips.style.display = 'none';
      updateCategoryDropdown('Income');
    } else if (newType === 'Transfer') {
      if (walletLabel) walletLabel.innerText = "Dari Kantong Asal";
      document.getElementById('form-category-group').style.display = 'none';
      document.getElementById('form-dest-wallet-group').style.display = 'block';
      if (quickChips) quickChips.style.display = 'none';

      // Cegah default dompet asal dan tujuan sama jika ada dompet lain
      const srcEl = document.getElementById('form-wallet');
      const destEl = document.getElementById('form-dest-wallet');
      if (srcEl && destEl && srcEl.value === destEl.value && appState.data && appState.data.wallets && appState.data.wallets.length > 1) {
        const otherW = appState.data.wallets.find(w => w.id !== srcEl.value);
        if (otherW) destEl.value = otherW.id;
      }
    }
  }

  /**
   * QC v1.8.0: sinkronkan select pada modal transaksi yang sudah terbuka saat
   * data dashboard baru tiba (modal bisa dibuka lebih dulu dari hasil getDashboard).
   */
  function refreshOpenTransactionModal_() {
    const modal = document.getElementById('transaction-modal');
    if (!modal || modal.style.display !== 'flex') return;
    updateWalletDropdowns();
    updateCategoryDropdown(appState.form.type || 'Expense');
  }

  function updateCategoryDropdown(type) {
    const el = document.getElementById('form-category');
    if (!el || !appState.data || !appState.data.categories) return;
    const cats = appState.data.categories.filter(c => c.type === type);
    const currentVal = el.value;
    el.innerHTML = cats.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
    // S-20: pertahankan pilihan bila masih valid (mis. saat edit).
    if (currentVal && Array.from(el.options).some(o => o.value === currentVal)) {
      el.value = currentVal;
    }
  }

  function getWalletDisplay(tx, wallets) {
    const w = (wallets || []).find(item => item.id === tx.walletId);
    const wName = w ? w.name : (tx.walletName || '-');
    if (tx.type === 'Transfer') {
      const destW = (wallets || []).find(item => item.id === tx.destWalletId);
      const destName = destW ? destW.name : (tx.destWalletName || '-');
      if (wName === destName) return wName;
      return `${wName} \u2192 ${destName}`;
    }
    return wName;
  }

  function submitTransactionForm() {
    const editIdEl = document.getElementById('form-edit-id');
    const editId = editIdEl ? editIdEl.value : '';
    const rawAmount = parseCurrencyValue(document.getElementById('form-amount').value);
    const dateVal = document.getElementById('form-date').value;
    const notesVal = document.getElementById('form-notes').value;
    const walletVal = document.getElementById('form-wallet').value;
    const destWalletEl = document.getElementById('form-dest-wallet');
    const destWalletVal = destWalletEl ? destWalletEl.value : '';
    const catEl = document.getElementById('form-category');
    const catVal = catEl ? catEl.value : '';

    if (!rawAmount || rawAmount <= 0) {
      showToast("Masukkan nominal transaksi yang valid (> 0).");
      return;
    }
    if (!walletVal) {
      showToast("Pilih kantong dompet transaksi.");
      return;
    }

    // S-14: tolak tanggal dengan tahun tidak wajar (salah ketik tahun).
    const yearNum = parseInt(String(dateVal).substring(0, 4), 10);
    const maxYear = new Date().getFullYear() + 1;
    if (!dateVal || isNaN(yearNum) || yearNum < 2000 || yearNum > maxYear) {
      showToast("Tanggal transaksi tidak valid. Periksa kembali tanggal yang dipilih.");
      return;
    }

    // S-15: hentikan lebih awal bila perangkat sedang offline.
    if (navigator.onLine === false) {
      showToast("Perangkat sedang offline. Sambungkan internet lalu coba lagi.");
      return;
    }

    if (appState.form.type === 'Transfer') {
      if (!destWalletVal) {
        showToast("Pilih rekening tujuan transfer.");
        return;
      }
      if (walletVal === destWalletVal) {
        showToast("Kantong asal dan kantong tujuan transfer tidak boleh sama.");
        return;
      }
    } else if (!catVal) {
      showToast("Pilih kategori transaksi terlebih dahulu.");
      return;
    }

    const payload = {
      type: appState.form.type,
      amount: rawAmount,
      date: dateVal,
      walletId: walletVal,
      destWalletId: appState.form.type === 'Transfer' ? destWalletVal : '',
      categoryId: appState.form.type === 'Transfer' ? '' : catVal,
      notes: notesVal
    };

    if (editId) {
      payload.id = editId;
    }

    const submitBtn = document.getElementById('btn-submit-tx');
    const origBtnText = submitBtn ? submitBtn.innerText : 'Simpan Transaksi';
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerText = 'Menyimpan...';
    }

    const action = editId ? 'updateTransaction' : 'createTransaction';

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      showToast("Layanan Google Apps Script tidak tersedia di halaman ini.");
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerText = origBtnText;
      }
      return;
    }

    google.script.run
      .withSuccessHandler(res => {
        if (res && res.success) {
          closeModal('transaction-modal');
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerText = origBtnText;
          }
          if (payload.date && payload.date.length >= 7) {
            const txPeriod = payload.date.substring(0, 7);
            // S-12: transaksi baru memindahkan fokus Buku Kas ke bulan tsb,
            // bukan mengubah periode Dashboard.
            appState.bookMonthPeriod = txPeriod;
          }
          loadDashboardData();
        } else {
          if (handleAccessDenied_(res)) return;
          showToast("Gagal menyimpan transaksi: " + ((res && res.error) || "Terjadi kesalahan"));
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerText = origBtnText;
          }
        }
      })
      .withFailureHandler(err => {
        showToast("Gagal terhubung: " + err.message);
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerText = origBtnText;
        }
      })
      .apiDispatcher(action, payload);
  }

  function submitBudgetForm() {

    if (!catId) return showToast("Pilih kategori pengeluaran.");

          closeModal('budget-modal');

          }
          loadDashboardData();
        } else {
          if (handleAccessDenied_(res)) return;
          showToast("Gagal menyimpan anggaran: " + ((res && res.error) || "Terjadi kesalahan"));
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerText = origBtnText;
          }
        }
      })
      .withFailureHandler(err => {
        showToast("Gagal terhubung: " + err.message);
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerText = origBtnText;

  function deleteBudget(budgetId) {
    if (!confirm("Hapus batas anggaran ini?")) return;
    appState.isLoading = true;
    renderApp();
    google.script.run
      .withSuccessHandler(() => loadDashboardData())
      .withFailureHandler(err => { showToast(err.message); appState.isLoading = false; renderApp(); })
      .apiDispatcher('deleteBudget', { id: budgetId });
  }

  function deleteTx(id) {
    if (!confirm("Hapus catatan transaksi ini?")) return;
    appState.isLoading = true;
    renderApp();

    google.script.run
      .withSuccessHandler(res => { if (handleAccessDenied_(res)) return; if (res && res.success) loadDashboardData(); else showToast("Gagal: " + (res.error || "Terjadi kesalahan")); })
      .withFailureHandler(err => { showToast(err.message); appState.isLoading = false; renderApp(); })
      .apiDispatcher('deleteTransaction', { id: id });

  function filterCategoryChange(val) {
    // S-07: filter memakai ID kategori (bukan nama) agar stabil saat rename
    // dan tidak mencampur nama sama pada tipe berbeda.
    appState.filterCategory = val;
    renderApp();
    restoreSearchFocus();

  function searchTransactions(val) {
    // S-03: simpan apa adanya (huruf besar tetap dipertahankan) dan pertahankan
    // fokus/kursor input pencarian setelah render ulang.
    const pos = (document.activeElement && document.activeElement.selectionStart) || val.length;
    appState.searchQuery = val;
    renderApp();
    restoreSearchFocus(pos);
  }

  function restoreSearchFocus(pos) {
    const input = document.getElementById('tx-search-input');
    if (!input) return;
    const caret = (pos === undefined || pos === null) ? input.value.length : pos;

  function openCategoryModal() {
    const nameEl = document.getElementById('category-name');
    const typeEl = document.getElementById('category-type');
    const submitBtn = document.getElementById('btn-submit-cat');
    if (nameEl) nameEl.value = '';
    if (typeEl) typeEl.value = appState.form.type === 'Income' ? 'Income' : 'Expense';
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.innerText = 'Simpan Kategori';
    }
    // S-19: fokus eksplisit (atribut autofocus hanya bekerja saat muat halaman).
    openModal('category-modal');
    if (nameEl) {
      try { nameEl.focus({ preventScroll: true }); } catch (e) { nameEl.focus(); }
    }
  }

  function submitCategoryForm() {
    const nameEl = document.getElementById('category-name');
    const typeEl = document.getElementById('category-type');
    const name = nameEl ? nameEl.value.trim() : '';
    const type = typeEl ? typeEl.value : 'Expense';
    if (!name) return showToast("Nama kategori wajib diisi.");

    const submitBtn = document.getElementById('btn-submit-cat');
    const origBtnText = submitBtn ? submitBtn.innerText : 'Simpan Kategori';
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerText = 'Menyimpan...';
    }

    google.script.run
      .withSuccessHandler(res => {
        if (res && res.success) {
          closeModal('category-modal');
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerText = origBtnText;
          }
          if (res.data) {
            if (!appState.data.categories) appState.data.categories = [];
            const exists = appState.data.categories.some(c => c.id === res.data.id);
            if (!exists) {
              appState.data.categories.push(res.data);
            }
            updateCategoryDropdown(appState.form.type);
            const formCat = document.getElementById('form-category');
            if (formCat) formCat.value = res.data.id;
            appState.form.categoryId = res.data.id;
          }
          loadDashboardData();
        } else {
          if (handleAccessDenied_(res)) return;
          showToast("Gagal menyimpan kategori: " + ((res && res.error) || "Terjadi kesalahan"));
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerText = origBtnText;
          }
        }
      })
      .withFailureHandler(err => {
        showToast("Gagal terhubung: " + err.message);
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerText = origBtnText;
        }
      })
      .apiDispatcher('saveCategory', { name, type });
  }

  function deleteWallet(id) {
    if (!appState.data || !appState.data.wallets) return;
    const targetW = appState.data.wallets.find(w => w.id === id);
    // R-06: blokir bila saldo tidak nol (termasuk negatif) dan bila ini dompet aktif terakhir.
    if (targetW && appState.data.wallets.length <= 1) {
      showToast("Aplikasi memerlukan minimal 1 kantong dompet aktif untuk mencatat keuangan.");
      return;
    }
    if (targetW && (Number(targetW.balance) || 0) !== 0) {
      showToast("Kantong dompet masih memiliki saldo (" + formatRupiah(targetW.balance) + "). Pindahkan atau kosongkan saldo dompet terlebih dahulu sebelum menghapus.");
      return;
    }
    if (!confirm("Hapus / nonaktifkan kantong dompet ini?")) return;
    if (appState.isLoading) return;
    appState.isLoading = true;
    renderApp();

    google.script.run
      .withSuccessHandler(res => {
        if (res && res.success) {
          loadDashboardData();
        } else {
          if (handleAccessDenied_(res)) return;
          showToast("Gagal menghapus dompet: " + ((res && res.error) || "Terjadi kesalahan"));
          appState.isLoading = false;
          renderApp();
        }
      })
      .withFailureHandler(err => {
        showToast("Gagal terhubung: " + err.message);
        appState.isLoading = false;
        renderApp();
      })
      .apiDispatcher('deleteWallet', { id: id });
  }

  function restoreWallet(id) {
    if (!confirm("Aktifkan kembali dompet ini?")) return;
    if (appState.isLoading) return;
    appState.isLoading = true;
    renderApp();
    google.script.run
      .withSuccessHandler(res => {
        if (res && res.success) {
          loadDashboardData();
        } else {
          if (handleAccessDenied_(res)) return;
          showToast("Gagal mengaktifkan dompet: " + ((res && res.error) || "Terjadi kesalahan"));
          appState.isLoading = false;
          renderApp();
        }
      })
      .withFailureHandler(err => {
        showToast("Gagal terhubung: " + err.message);
        appState.isLoading = false;
        renderApp();
      })
      .apiDispatcher('restoreWallet', { id: id });
  }

        </div>

        <!-- Ticker Summary Bar (Realbyte-inspired) -->
        <div class="ticker-card">
          <div class="ticker-item">
            <div class="ticker-label">Pemasukan</div>
            <div class="ticker-val text-income tabular">+${formatRupiah(mIncome)}</div>
          </div>
          <div class="ticker-item">
            <div class="ticker-label">Pengeluaran</div>
            <div class="ticker-val text-expense tabular">-${formatRupiah(mExpense)}</div>
          </div>
          <div class="ticker-item">
            <div class="ticker-label">${mNet < 0 ? 'Defisit Kas' : 'Sisa Kas'}</div>
            <div class="ticker-val tabular ${mNet < 0 ? 'text-expense font-bold' : ''}">${formatRupiah(mNet)}</div>
          </div>
        </div>

        ${appState.bookView === 'daily' ? `
          <!-- Filter & Search Controls -->
          <div class="filter-controls">
            <input type="text" id="tx-search-input" class="form-input filter-search" placeholder="Cari catatan transaksi..." oninput="searchTransactions(this.value)" value="${esc(appState.searchQuery)}">
            <select class="form-select filter-category" onchange="filterCategoryChange(this.value)">
              <option value="ALL">Semua Kategori</option>
              <optgroup label="Pengeluaran">
                ${d.categories.filter(c => c.type === 'Expense').map(c => `
                  <option value="${esc(c.id)}" ${appState.filterCategory === c.id ? 'selected' : ''}>${esc(c.name)}</option>
                `).join('')}
              </optgroup>
              <optgroup label="Pemasukan">
                ${d.categories.filter(c => c.type === 'Income').map(c => `
                  <option value="${esc(c.id)}" ${appState.filterCategory === c.id ? 'selected' : ''}>${esc(c.name)}</option>
                `).join('')}
              </optgroup>
            </select>
          </div>

          <!-- Date-Grouped Transaction List -->
          ${dateGroups.length === 0 ? `
            <div class="ledger-box" style="padding: 36px; text-align: center; color: var(--text-muted); font-size: 13px;">
              Belum ada catatan transaksi di bulan ${formatPeriodMonth(bookPeriod)}. Ketuk tombol + untuk mencatat.
            </div>
          ` : dateGroups.map(group => `
            <div class="date-group">
              <div class="date-group-header">
                <span class="date-group-title">${formatFullDateWithDay(group.date)}</span>
                <span class="date-group-subtotal tabular">
                  <span class="text-income">+${formatRupiah(group.totalIncome)}</span>
                  <span style="color: var(--text-subtle); margin: 0 4px;">/</span>
                  <span class="text-expense">-${formatRupiah(group.totalExpense)}</span>
                  <span style="color: var(--text-subtle); margin: 0 4px;">|</span>
                  <span class="${group.totalNet >= 0 ? 'text-income' : 'text-expense'}">${group.totalNet > 0 ? '+' : ''}${formatRupiah(group.totalNet)}</span>
                </span>
              </div>
              <div class="date-group-items">
                ${group.items.map(tx => {
                  const wDisplay = getWalletDisplay(tx, d.wallets);
                  return `
                  <div class="ledger-row">
                    <div class="ledger-notes">
                      <div class="ledger-notes-text">${esc(tx.notes || (tx.type === 'Transfer' ? 'Pindah Saldo Dompet' : '-'))}</div>
                      <div class="ledger-sub" style="display:flex; align-items:center; gap:6px; margin-top:3px;">
                        <span class="wallet-tag">${esc(wDisplay)}</span>
                        <span style="font-size: 11px; color: var(--text-muted);">${esc(tx.categoryName)}</span>
                      </div>
                    </div>
                    <div class="ledger-amount tabular ${tx.type === 'Income' ? 'text-income' : (tx.type === 'Expense' ? 'text-expense' : '')}">
                      ${tx.type === 'Income' ? '+' : (tx.type === 'Expense' ? '-' : '')}${formatRupiah(tx.amount)}
                    </div>
                    <div class="ledger-action" style="text-align: right; display: flex; gap: 4px; justify-content: flex-end; align-items: center;">
                      <button class="btn-delete-row touch-btn" title="Edit transaksi" data-action="edit-tx" data-id="${esc(tx.id)}" aria-label="Edit">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>
                      </button>
                      <button class="btn-delete-row touch-btn" title="Hapus transaksi" data-action="delete-tx" data-id="${esc(tx.id)}" aria-label="Hapus">&times;</button>
                    </div>
                  </div>
                  `;
                }).join('')}
              </div>
            </div>
          `).join('')}
        ` : appState.bookView === 'monthly' ? `
          <!-- Catatan Transaksi Bulanan -->
          ${renderMonthlyView(d.recentTransactions, d.wallets)}
        ` : `
          <!-- Visual Donut Chart & Stats Tab -->
          <div class="stats-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
              <div>
                <div style="font-size: 15px; font-weight: 700; letter-spacing: -0.015em;">Diagram Alokasi Dana</div>
                <div style="font-size: 11.5px; color: var(--text-muted);">Periode ${formatPeriodMonth(bookPeriod)}</div>
              </div>
              <div class="cycle-pill-group">
                <button class="cycle-pill ${appState.statsType === 'Expense' ? 'active' : ''}" onclick="switchStatsType('Expense')">Pengeluaran</button>
                <button class="cycle-pill ${appState.statsType === 'Income' ? 'active' : ''}" onclick="switchStatsType('Income')">Pemasukan</button>
              </div>
            </div>

            ${(() => {
              const breakdown = getCategoryBreakdown(monthTxs, appState.statsType);
              return renderDonutChart(breakdown.items, breakdown.total);
            })()}
          </div>

          <!-- Sebaran per Kantong Dompet (S-13: mengikuti mode statistik) -->
          <div class="overview-panel" style="margin-top: 14px;">
            <div class="section-header" style="margin-bottom: 8px;">
              <div>
                <div class="section-title">Alokasi per Kantong Dompet</div>
                <div style="font-size: 11.5px; color: var(--text-muted);">Akun yang paling sering digunakan untuk ${appState.statsType === 'Income' ? 'pemasukan' : 'pengeluaran'}</div>
              </div>
            </div>
            ${(() => {
              const wRank = getWalletBreakdown(monthTxs, d.wallets, appState.statsType);
              if (wRank.length === 0) {
                return `<div style="font-size: 12.5px; color: var(--text-muted); padding: 8px 0;">Belum ada ${appState.statsType === 'Income' ? 'pemasukan' : 'pengeluaran'} pada bulan ini.</div>`;
              }
              return wRank.map(w => `
                <div class="mini-bar-item" style="margin-bottom: 10px;">
                  <div class="mini-bar-header">
                    <span style="font-weight: 600;">${esc(w.walletName)}</span>
                    <span class="tabular font-medium">${formatRupiah(w.amount)} (${Math.min(100, w.percent)}%)</span>
                  </div>
                  <div class="progress-track">
                    <div class="progress-fill" style="width: ${Math.min(100, w.percent)}%;"></div>
                  </div>
                </div>
              `).join('');
            })()}
          </div>
        `}
      `;
    } else if (appState.activeTab === 'settings') {
      const inactiveWallets = d.inactiveWallets || [];
      const incomeCats = d.categories.filter(c => c.type === 'Income');
      const expenseCats = d.categories.filter(c => c.type === 'Expense');
      contentHtml = `
        <!-- Tab Pengaturan: kelola dompet, kategori, anggaran -->
        <div class="section-header">
          <div>
            <div class="section-title">Kantong Saldo</div>
            <div style="font-size: 11.5px; color: var(--text-muted);">${d.wallets.length} Aktif · ${inactiveWallets.length} Nonaktif</div>
          </div>
          <button class="btn btn-sm" onclick="openModal('wallet-modal')">+ Tambah Dompet</button>
        </div>
        <div class="wallets-grid">
          ${d.wallets.length === 0 ? `
            <div style="grid-column: 1 / -1; padding: 18px; background: var(--bg-surface); border: 1px dashed var(--border-color); border-radius: 14px; font-size: 12.5px; color: var(--text-muted);">
              Belum ada kantong dompet aktif. Klik <b>+ Tambah Dompet</b> untuk mendaftarkan rekening atau kas Anda.
            </div>
          ` : d.wallets.map(w => `
            <div class="wallet-pill">
              <div class="wallet-pill-top">
                <span style="font-weight: 600;">${esc(w.name)}</span>
                <div style="display:flex; align-items:center; gap:6px;">
                  <span class="user-badge">${esc(w.type)}</span>
                  <button class="btn-delete-row" title="Hapus dompet" data-action="delete-wallet" data-id="${esc(w.id)}" aria-label="Hapus dompet ${esc(w.name)}">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2m-9 0v14a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6"/></svg>
                  </button>
                </div>
              </div>
              <div class="wallet-pill-val tabular">${formatRupiah(w.balance)}</div>
            </div>
          `).join('')}
        </div>
        ${inactiveWallets.length > 0 ? `
        <div class="overview-panel" style="margin-bottom: 24px; padding: 12px 14px;">
          <div class="section-header" style="margin-bottom: 8px;">
            <div>
              <div class="section-title">Dompet Nonaktif</div>
              <div style="font-size: 11.5px; color: var(--text-muted);">Riwayat transaksinya tetap tersimpan di buku kas</div>
            </div>
          </div>
          ${inactiveWallets.map(w => `
            <div class="mini-bar-item" style="margin-bottom: 8px;">
              <div class="mini-bar-header">
                <span style="font-weight: 600;">${esc(w.name)} <span class="user-badge">${esc(w.type)}</span></span>
                <button class="btn btn-sm touch-btn" data-action="restore-wallet" data-id="${esc(w.id)}">Aktifkan</button>
              </div>
            </div>
          `).join('')}
        </div>
        ` : ''}

        <!-- Kategori Pemasukan -->
        <div class="section-header">
          <div>
            <div class="section-title">Kategori Pemasukan</div>
            <div style="font-size: 11.5px; color: var(--text-muted);">${incomeCats.length} kategori</div>
          </div>
          <button class="btn btn-sm" onclick="openCategoryModal()">+ Tambah Kategori</button>
        </div>
        <div class="overview-panel" style="margin-bottom: 24px;">
          ${incomeCats.length === 0 ? '<div style="font-size: 12.5px; color: var(--text-muted); padding: 10px 0;">Belum ada kategori pemasukan.</div>'
            : incomeCats.map(c => `
            <div class="mini-bar-item" style="margin-bottom: 6px;">
              <div class="mini-bar-header">
                <span style="font-weight: 600;">${esc(c.name)}</span>
                <span class="user-badge">Income</span>
              </div>
            </div>`).join('')}
        </div>

        <!-- Kategori Pengeluaran -->
        <div class="section-header">
          <div>
            <div class="section-title">Kategori Pengeluaran</div>
            <div style="font-size: 11.5px; color: var(--text-muted);">${expenseCats.length} kategori</div>
          </div>
          <button class="btn btn-sm" onclick="openCategoryModal()">+ Tambah Kategori</button>
        </div>
        <div class="overview-panel" style="margin-bottom: 24px;">
          ${expenseCats.length === 0 ? '<div style="font-size: 12.5px; color: var(--text-muted); padding: 10px 0;">Belum ada kategori pengeluaran.</div>'
            : expenseCats.map(c => `
            <div class="mini-bar-item" style="margin-bottom: 6px;">
              <div class="mini-bar-header">
                <span style="font-weight: 600;">${esc(c.name)}</span>
                <span class="user-badge">Expense</span>
              </div>
            </div>`).join('')}
        </div>

        <!-- Anggaran -->
        <div class="section-header">
          <div>
            <div class="section-title">Batas Anggaran Bulanan</div>
            <div style="font-size: 11.5px; color: var(--text-muted);">${d.budgets.length} anggaran aktif</div>
          </div>
          <button class="btn btn-sm" onclick="openModal('budget-modal')">+ Atur Anggaran</button>
        </div>
        <div class="overview-panel" style="margin-bottom: 24px;">
          ${d.budgets.length === 0 ? '<div style="font-size: 12.5px; color: var(--text-muted); padding: 10px 0;">Belum ada anggaran disetel. Klik tombol <b>+ Atur Anggaran</b> untuk membatasi belanja per kategori.</div>'
            : d.budgets.map(b => {
              const spent = currentMonthTxs.filter(t => t.type === 'Expense' && t.categoryId === b.categoryId).reduce((s, t) => s + (Number(t.amount) || 0), 0);
              const limit = Number(b.limit) || 0;
              const percent = limit > 0 ? Math.round((spent / limit) * 100) : 0;
              const remaining = limit - spent;
              return `
              <div class="mini-bar-item" style="margin-bottom: 10px;">
                <div class="mini-bar-header">
                  <span style="font-weight: 600;">${esc(b.categoryName)}</span>
                  <div style="display:flex; align-items:center; gap:8px;">
                    <span class="tabular font-medium">${formatRupiah(spent)} / <span style="color:var(--text-muted);">${formatRupiah(limit)}</span></span>
                    <button class="btn-delete-row touch-btn" title="Hapus batas" data-action="delete-budget" data-id="${esc(b.id)}" aria-label="Hapus anggaran ${esc(b.categoryName)}">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2m-9 0v14a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6"/></svg>
                    </button>
                  </div>
                </div>
                <div class="progress-track">
                  <div class="progress-fill ${percent >= 100 ? 'over' : ''}" style="width: ${Math.min(100, percent)}%;"></div>
                </div>
                <div style="font-size: 11px; color: var(--text-subtle); margin-top: 3px;">
                  ${remaining >= 0 ? `Tersisa: ${formatRupiah(remaining)}` : `<span class="text-expense font-bold">Melebihi budget ${formatRupiah(Math.abs(remaining))}</span>`}
                </div>
              </div>`;
            }).join('')}
        </div>

        <!-- Tentang aplikasi -->
        <div class="overview-panel" style="padding: 14px;">
          <div class="section-title" style="margin-bottom: 6px;">Tentang Aplikasi</div>
          <div style="font-size: 12px; color: var(--text-muted); line-height: 1.6;">
            Finance Tracker · semua data tersimpan aman di Google Sheets Anda sendiri.
            Untuk membuka cepat dari layar utama HP, gunakan <b>Add to Home Screen</b> pada Chrome/Safari —
            ini pintasan browser, bukan aplikasi yang diinstal dari Play Store/App Store.
          </div>
        </div>
      `;
    }

    root.innerHTML = contentHtml;
    appState.lastRenderedTab = appState.activeTab;
    if (sameTab) {
      try { window.scrollTo(0, scrollBefore); } catch (e) { /* abaikan */ }
    }

    document.querySelectorAll('.nav-item').forEach(el => {
      if (el.getAttribute('data-tab') === appState.activeTab) el.classList.add('active');
      else el.classList.remove('active');
    });
    document.querySelectorAll('.mobile-nav-item').forEach(el => {
      if (el.getAttribute('data-tab') === appState.activeTab) el.classList.add('active');
      else el.classList.remove('active');
    });

    updateWalletDropdowns();
    } catch (err) {
      console.error("Render error in renderApp:", err);
      root.innerHTML = `
        <div style="padding: 24px; background: var(--bg-surface); border: 1px solid var(--color-expense); border-radius: var(--radius-md); color: var(--color-expense);">
          <div style="font-weight: 700; margin-bottom: 8px;">Terjadi Kendala Memuat Tampilan</div>
          <div style="font-size: 12.5px; color: var(--text-muted); font-family: monospace;">${esc(err && err.message)}</div>
          <div style="margin-top: 10px;"><button class="btn btn-sm touch-btn" onclick="retryLoad()">Muat Ulang</button></div>
        </div>
      `;
    }
  }

  function updateWalletDropdowns() {
    const d = appState.data;
    if (!d || !d.wallets) return;
    const srcEl = document.getElementById('form-wallet');
    const destEl = document.getElementById('form-dest-wallet');
    const inactive = d.inactiveWallets || [];
    const buildOptions = (selectEl) => {
      if (!selectEl) return;
      const currentVal = selectEl.value;
      let html = d.wallets.map(w => `<option value="${esc(w.id)}">${esc(w.name)}</option>`).join('');
      // S-08: dompet nonaktif ikut sebagai opsi hanya bila sedang dipakai
      // (mis. transaksi lama yang sedang diedit).
      const usingInactive = currentVal && inactive.some(w => w.id === currentVal);
      if (usingInactive) {
        const w = inactive.find(x => x.id === currentVal);
        html += `<option value="${esc(w.id)}">${esc(w.name)} (Nonaktif)</option>`;
      }
      selectEl.innerHTML = html;
      if (currentVal && Array.from(selectEl.options).some(o => o.value === currentVal)) {
        selectEl.value = currentVal;
      }
    };
    buildOptions(srcEl);
    buildOptions(destEl);
  }

  /** FASE 3: onboarding pertama kali — tampil sekali, lalu diingat localStorage. */
  function initOnboarding() {
    const card = document.getElementById('onboarding-card');
    if (!card) return;
    let seen = false;
    try { seen = localStorage.getItem('ft_onboarding_done') === '1'; } catch (e) {}
    if (!seen) card.style.display = '';
  }

  function dismissOnboarding() {
    const card = document.getElementById('onboarding-card');
    if (card) card.style.display = 'none';
    try { localStorage.setItem('ft_onboarding_done', '1'); } catch (e) {}
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }
  document.addEventListener('DOMContentLoaded', initOnboarding);
</script>
